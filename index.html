<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantry</title>
<meta name="theme-color" content="#1F5C3F">
<meta name="description" content="Pantry inventory and smart grocery list">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pantry">
<style>
:root{
  --bg:#F1F5EF; --surface:#FFFFFF; --ink:#16271D; --muted:#5A6B60; --line:#D9E2D6;
  --accent:#1F5C3F; --on-accent:#FFFFFF; --ok:#3F8A5C; --low:#E9B43C; --low-ink:#8A5F00;
  --out:#B23A48; --out-soft:#F8E3E5; --low-soft:#FBF0D3; --track:#E4EBE1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#17211B; --ink:#E6EEE8; --muted:#97A89C; --line:#2A3830;
    --accent:#86CFA2; --on-accent:#0F1612; --ok:#6DBB8A; --low:#F2C14E; --low-ink:#F2C14E;
    --out:#EC7A87; --out-soft:#3A1E23; --low-soft:#352B12; --track:#24302A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211B; --ink:#E6EEE8; --muted:#97A89C; --line:#2A3830;
  --accent:#86CFA2; --on-accent:#0F1612; --ok:#6DBB8A; --low:#F2C14E; --low-ink:#F2C14E;
  --out:#EC7A87; --out-soft:#3A1E23; --low-soft:#352B12; --track:#24302A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 120px}

header h1{font-size:clamp(2.1rem,8vw,3rem);line-height:1;margin:6px 0 8px;font-weight:800;letter-spacing:-.03em}
header p{margin:0;color:var(--muted)}
.sync{font-size:.85rem;color:var(--muted);margin-top:6px;min-height:1.2em}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;gap:6px;padding:14px 0 12px;margin-top:10px}
.tab{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:9px 12px;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{display:inline-block;min-width:1.5em;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--out);color:#fff;font-size:.8rem}

.add{display:flex;gap:8px;margin:4px 0 18px}
.add input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--out);border:1.5px solid var(--out)}

h2{font-size:1.05rem;margin:22px 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
h2 .dot{width:10px;height:10px;border-radius:50%}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}

.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .why{font-size:.88rem;color:var(--muted)}
.row.done .name{text-decoration:line-through;color:var(--muted)}
.check{appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;background:transparent;margin:0}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:7px;height:13px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}

.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;flex:none}
.step button{width:34px;height:34px;border:0;background:transparent;font-size:1.2rem;font-weight:700}
.step span{min-width:2.2em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* pantry fill gauge: the jar level */
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .open{all:unset;cursor:pointer;display:block;min-width:0}
.item .open:focus-visible{outline:3px solid var(--accent);border-radius:6px}
.item .name{font-weight:600}
.item .meta{font-size:.88rem;color:var(--muted)}
.gauge{grid-column:1/-1;height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.gauge i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s ease}
.gauge.low i{background:var(--low)} .gauge.out i{background:var(--out)}
.gauge.learning i{background:repeating-linear-gradient(90deg,var(--muted) 0 6px,transparent 6px 10px);opacity:.5}
.tag{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px}
.tag.out{background:var(--out-soft);color:var(--out)} .tag.low{background:var(--low-soft);color:var(--low-ink)}

.empty{text-align:center;padding:36px 20px;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px}
.empty p{color:var(--muted);margin:6px 0 16px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);display:none}
.bar.show{display:block}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .in span{flex:1;color:var(--muted)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:1.4rem}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.insight{background:var(--bg);border-radius:14px;padding:12px 14px;margin:6px 0 14px;font-size:.92rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;margin-left:10px}
.settings{font-size:.92rem;color:var(--muted);margin-top:28px;text-align:center}
.settings button{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="headline">Your pantry</h1>
    <p id="subline">Loading…</p>
    <div class="sync" id="sync" aria-live="polite"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-list" aria-selected="true">Shopping list</button>
    <button class="tab" role="tab" id="t-pantry" aria-selected="false">Pantry</button>
  </nav>

  <form class="add" id="addForm" autocomplete="off">
    <input id="addInput" list="names" placeholder="Add an item, e.g. oat milk" aria-label="Item name">
    <datalist id="names"></datalist>
    <button class="btn" type="submit">Add</button>
  </form>

  <main id="view"></main>

  <div class="settings">Buy <b id="sAhead"></b> days ahead, shop every <b id="sCycle"></b> days. <button id="openSettings">Settings and backup</button></div>
</div>

<div class="bar" id="bar"><div class="in"><span id="barText"></span><button class="btn" id="putAway">Put away</button></div></div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const DAY = 864e5;
  const CATS = ["Produce","Dairy & eggs","Meat & fish","Bakery","Pantry staples","Frozen","Drinks","Snacks","Household","Personal care","Other"];
  const STARTERS = [
    ["Milk","Dairy & eggs","cartons"],["Eggs","Dairy & eggs","eggs"],["Butter","Dairy & eggs","blocks"],
    ["Bread","Bakery","loaves"],["Bananas","Produce","bananas"],["Onions","Produce","onions"],
    ["Rice","Pantry staples","bags"],["Pasta","Pantry staples","packs"],["Coffee","Drinks","bags"],
    ["Olive oil","Pantry staples","bottles"],["Toilet paper","Household","rolls"],["Dish soap","Household","bottles"]
  ];
  const LS_KEY = "pantry-v1";

  let S = { v:1, items:[], settings:{ ahead:3, cycle:7 } };
  let tab = "list";

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  const fmt = n => (Math.round(n*10)/10).toString();
  const find = id => S.items.find(i => i.id === id);

  /* ---------- consumption model ---------- */
  function rate(it){
    const now = Date.now();
    const start = Math.max(it.since || now, now - 90*DAY);
    const ev = (it.used||[]).filter(e => e[0] >= start);
    if (ev.length < 2) return null;
    const total = ev.reduce((a,e) => a + e[1], 0);
    if (total <= 0) return null;
    const span = Math.max(2, (now - start) / DAY);
    return total / span;                     // units per day
  }
  function info(it){
    const r = rate(it), ahead = S.settings.ahead, cycle = S.settings.cycle;
    const daysLeft = r ? it.qty / r : null;
    let status = "ok", why = "";
    if (it.qty <= 0){ status = "out"; why = "Out"; }
    else if (daysLeft !== null && daysLeft <= ahead){ status = "low"; why = daysLeft < 1 ? "Runs out today" : `About ${Math.round(daysLeft)} day${Math.round(daysLeft)===1?"":"s"} left`; }
    else if (it.min != null && it.qty <= it.min){ status = "low"; why = `At or below your minimum of ${fmt(it.min)}`; }
    let suggest;
    if (r) suggest = Math.max(1, Math.ceil(r*(cycle+ahead) - Math.max(0,it.qty)));
    else { const last = (it.bought||[]).slice(-1)[0]; suggest = last ? last[1] : 1; }
    const pct = r ? Math.min(1, daysLeft/(cycle+ahead)) : (it.min != null ? Math.min(1, it.qty/Math.max(1,it.min*3)) : (it.qty>0 ? .55 : 0));
    return { r, daysLeft, status, why, suggest, pct, learning: !r && it.min == null };
  }
  const needs = () => S.items.filter(it => it.onList || info(it).status !== "ok");

  /* ---------- persistence ---------- */
  function localSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
  function localLoad(){ try{ const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); }catch(e){} return null; }
  function normalize(d){
    if (!d || !Array.isArray(d.items)) return null;
    d.settings = Object.assign({ahead:3,cycle:7}, d.settings||{});
    d.items.forEach(it => { it.used = it.used||[]; it.bought = it.bought||[]; });
    return d;
  }
  function commit(){
    S.items.forEach(it => { if (it.used.length>80) it.used = it.used.slice(-80); if (it.bought.length>20) it.bought = it.bought.slice(-20); });
    localSave(); render();
  }
  function setSync(t){ $("sync").textContent = t; }
  function exportData(){
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pantry-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function importData(file){
    const r = new FileReader();
    r.onload = () => {
      try { const d = normalize(JSON.parse(r.result)); if (!d) throw 0; S = d; commit(); closeSheet(); toast("Backup restored"); }
      catch(e){ toast("That file isn’t a Pantry backup."); }
    };
    r.readAsText(file);
  }

  /* ---------- actions ---------- */
  function addItem(name, opts={}){
    const existing = S.items.find(i => i.name.toLowerCase() === name.toLowerCase());
    if (existing){ existing.onList = true; commit(); toast(`${existing.name} is on your list`); return existing; }
    const it = { id:uid(), name, cat:opts.cat||"Other", unit:opts.unit||"", qty:opts.qty ?? 0, min:null,
      since:Date.now(), used:[], bought:[], onList: opts.onList ?? true, inCart:false, cartQty:null };
    S.items.push(it); commit(); return it;
  }
  function use(it, amt=1){
    const a = Math.min(amt, it.qty); if (a <= 0) return;
    it.qty = Math.max(0, Math.round((it.qty - a)*100)/100); it.used.push([Date.now(), a]); commit();
  }
  function putAway(){
    const cart = S.items.filter(i => i.inCart); if (!cart.length) return;
    const snapshot = JSON.stringify(S);
    cart.forEach(it => {
      const q = it.cartQty ?? info(it).suggest;
      it.qty = Math.round((it.qty + q)*100)/100; it.bought.push([Date.now(), q]);
      it.inCart = false; it.cartQty = null; it.onList = false;
    });
    commit();
    toast(`Put away ${cart.length} item${cart.length===1?"":"s"}`, () => { S = JSON.parse(snapshot); commit(); });
  }

  /* ---------- rendering ---------- */
  function render(){
    const need = needs(), outN = need.filter(i => info(i).status==="out").length;
    const lowN = need.filter(i => info(i).status==="low").length;
    document.title = need.length ? `(${need.length}) Pantry` : "Pantry";
    if (!S.items.length){ $("headline").textContent = "Your pantry"; $("subline").textContent = "Add what you keep at home and it’ll learn how fast you go through it."; }
    else if (!need.length){ $("headline").textContent = "All stocked up"; $("subline").textContent = "Nothing needs buying right now."; }
    else {
      $("headline").textContent = `Buy ${need.length} thing${need.length===1?"":"s"}`;
      const bits = []; if (outN) bits.push(`${outN} out`); if (lowN) bits.push(`${lowN} running low`);
      const manual = need.length - outN - lowN; if (manual) bits.push(`${manual} added by you`);
      $("subline").textContent = bits.join(", ") + ".";
    }
    $("t-list").innerHTML = "Shopping list" + (need.length ? `<span class="n">${need.length}</span>` : "");
    $("t-list").setAttribute("aria-selected", tab==="list"); $("t-pantry").setAttribute("aria-selected", tab==="pantry");
    $("sAhead").textContent = S.settings.ahead; $("sCycle").textContent = S.settings.cycle;
    $("names").innerHTML = S.items.map(i => `<option value="${esc(i.name)}">`).join("");
    $("view").innerHTML = tab === "list" ? listView(need) : pantryView();
    const inCart = S.items.filter(i => i.inCart).length;
    $("bar").classList.toggle("show", inCart > 0);
    $("barText").textContent = `${inCart} in your cart`;
  }

  function listRow(it){
    const f = info(it), q = it.cartQty ?? f.suggest;
    const why = f.status !== "ok" ? f.why : "Added by you";
    return `<div class="row ${it.inCart?"done":""}">
      <input type="checkbox" class="check" data-cart="${it.id}" ${it.inCart?"checked":""} aria-label="In cart: ${esc(it.name)}">
      <div class="main"><div class="name">${esc(it.name)}</div><div class="why">${esc(why)}${it.unit?` · buy ${fmt(q)} ${esc(it.unit)}`:""}</div></div>
      <div class="step" aria-label="Quantity to buy">
        <button data-cq="${it.id}" data-d="-1" aria-label="Less">−</button><span>${fmt(q)}</span><button data-cq="${it.id}" data-d="1" aria-label="More">+</button>
      </div></div>`;
  }
  function listView(need){
    if (!S.items.length) return emptyState();
    if (!need.length) return `<div class="empty"><b>Nothing to buy</b><p>When something runs low, it shows up here on its own. Tap “−” in the pantry whenever you use something up.</p><button class="btn ghost" data-go="pantry">Open pantry</button></div>`;
    const groups = [["out","Out of stock","var(--out)"],["low","Running low","var(--low)"],["ok","Added by you","var(--muted)"]];
    return groups.map(([s,label,c]) => {
      const rows = need.filter(i => info(i).status === s);
      return rows.length ? `<h2><span class="dot" style="background:${c}"></span>${label}</h2><div class="group">${rows.map(listRow).join("")}</div>` : "";
    }).join("");
  }
  function pantryView(){
    if (!S.items.length) return emptyState();
    const byCat = {};
    S.items.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(i => (byCat[i.cat] = byCat[i.cat]||[]).push(i));
    return CATS.filter(c => byCat[c]).concat(Object.keys(byCat).filter(c => !CATS.includes(c))).map(c => `<h2>${esc(c)}</h2><div class="group">${byCat[c].map(it => {
      const f = info(it);
      const meta = f.r ? `Uses about ${fmt(f.r*7)} a week` + (f.daysLeft!=null && it.qty>0 ? `, ${Math.round(f.daysLeft)} days left` : "") : "Learning your pace";
      const tag = f.status==="ok" ? "" : `<span class="tag ${f.status}">${f.status==="out"?"Out":"Low"}</span>`;
      return `<div class="item">
        <button class="open" data-edit="${it.id}"><div class="name">${esc(it.name)}${tag}</div><div class="meta">${fmt(it.qty)} ${esc(it.unit)} · ${meta}</div></button>
        <div class="step"><button data-use="${it.id}" aria-label="Used one ${esc(it.name)}">−</button><span>${fmt(it.qty)}</span><button data-addq="${it.id}" aria-label="Add one ${esc(it.name)}">+</button></div>
        <div class="gauge ${f.learning?"learning":f.status}" aria-hidden="true"><i style="width:${Math.round(f.pct*100)}%"></i></div>
      </div>`;}).join("")}</div>`).join("");
  }
  function emptyState(){
    return `<div class="empty"><b>Start with what’s in your kitchen</b><p>Add items as you go, or load common staples and adjust the amounts.</p><button class="btn" id="starters">Add common staples</button></div>`;
  }

  /* ---------- sheets ---------- */
  function openSheet(html){ $("sheet").innerHTML = html; $("sheetBg").classList.add("show"); const f = $("sheet").querySelector("input"); if (f) f.focus(); }
  function closeSheet(){ $("sheetBg").classList.remove("show"); }
  function editSheet(it){
    const f = info(it);
    const lastBuy = it.bought.slice(-1)[0];
    const insight = f.r
      ? `You use about <b>${fmt(f.r*7)} ${esc(it.unit||"")}</b> a week. ${it.qty>0?`What you have lasts roughly <b>${Math.round(f.daysLeft)} days</b>.`:"You’re out."} Next time, buy about <b>${f.suggest}</b>.`
      : `Tap “−” each time you finish one. After a couple of uses, the app estimates when you’ll run out.`;
    openSheet(`<h3>${esc(it.name)}</h3>
      <div class="insight">${insight}${lastBuy?`<br>Last bought ${fmt(lastBuy[1])} on ${new Date(lastBuy[0]).toLocaleDateString()}.`:""}</div>
      <label class="field"><span>Name</span><input id="eName" value="${esc(it.name)}"></label>
      <div class="two">
        <label class="field"><span>Have now</span><input id="eQty" type="number" min="0" step="any" inputmode="decimal" value="${it.qty}"></label>
        <label class="field"><span>Unit</span><input id="eUnit" value="${esc(it.unit)}" placeholder="cartons, kg…"></label>
      </div>
      <div class="two">
        <label class="field"><span>Category</span><select id="eCat">${CATS.map(c=>`<option ${c===it.cat?"selected":""}>${c}</option>`).join("")}</select></label>
        <label class="field"><span>Always keep at least</span><input id="eMin" type="number" min="0" step="any" inputmode="decimal" value="${it.min ?? ""}" placeholder="Optional"></label>
      </div>
      <div class="actions"><button class="btn" id="eSave">Save</button><button class="btn ghost" id="eList">${it.onList?"Take off list":"Add to list"}</button></div>
      <div class="actions"><button class="btn ghost" id="eOut">I ran out</button><button class="btn danger" id="eDel">Delete</button></div>`);
    $("eSave").onclick = () => {
      const q = Math.max(0, parseFloat($("eQty").value) || 0);
      if (q < it.qty) it.used.push([Date.now(), it.qty - q]);
      it.qty = q; it.name = $("eName").value.trim() || it.name; it.unit = $("eUnit").value.trim(); it.cat = $("eCat").value;
      const m = $("eMin").value.trim(); it.min = m === "" ? null : Math.max(0, parseFloat(m)||0);
      closeSheet(); commit();
    };
    $("eList").onclick = () => { it.onList = !it.onList; if (!it.onList) it.inCart = false; closeSheet(); commit(); };
    $("eOut").onclick = () => { if (it.qty > 0) use(it, it.qty); closeSheet(); };
    $("eDel").onclick = () => { const snap = JSON.stringify(S); S.items = S.items.filter(x => x !== it); closeSheet(); commit(); toast(`Deleted ${it.name}`, () => { S = JSON.parse(snap); commit(); }); };
  }
  function settingsSheet(){
    openSheet(`<h3>Shopping rhythm</h3>
      <div class="insight">Items join your list when they’re expected to run out within your warning window. Suggested amounts cover one shopping cycle plus that window.</div>
      <div class="two">
        <label class="field"><span>Warn me (days ahead)</span><input id="sA" type="number" min="1" max="30" value="${S.settings.ahead}"></label>
        <label class="field"><span>I shop every (days)</span><input id="sC" type="number" min="1" max="60" value="${S.settings.cycle}"></label>
      </div>
      <div class="actions"><button class="btn" id="sSave">Save</button><button class="btn ghost" id="sClose">Cancel</button></div>
      <h3 style="margin-top:24px;font-size:1.1rem">Backup</h3>
      <div class="insight">Your pantry is stored only on this phone. Save a backup now and then, or to move to a new phone.</div>
      <div class="actions"><button class="btn ghost" id="sExport">Save backup</button><label class="btn ghost" style="text-align:center;cursor:pointer">Restore backup<input id="sImport" type="file" accept="application/json,.json" hidden></label></div>`);
    $("sExport").onclick = exportData;
    $("sImport").onchange = e => { const f = e.target.files[0]; if (f) importData(f); };
    $("sSave").onclick = () => {
      S.settings.ahead = Math.min(30, Math.max(1, parseInt($("sA").value)||3));
      S.settings.cycle = Math.min(60, Math.max(1, parseInt($("sC").value)||7));
      closeSheet(); commit();
    };
    $("sClose").onclick = closeSheet;
  }

  let toastTimer;
  function toast(msg, undo){
    const t = $("toast"); t.innerHTML = esc(msg) + (undo ? ` <button>Undo</button>` : "");
    if (undo) t.querySelector("button").onclick = () => { undo(); t.classList.remove("show"); };
    t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
  }

  /* ---------- events ---------- */
  $("t-list").onclick = () => { tab = "list"; render(); };
  $("t-pantry").onclick = () => { tab = "pantry"; render(); };
  $("openSettings").onclick = settingsSheet;
  $("putAway").onclick = putAway;
  $("sheetBg").addEventListener("click", e => { if (e.target === $("sheetBg")) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("addInput").value.trim(); if (!name) return;
    const it = addItem(name[0].toUpperCase() + name.slice(1), { onList: tab === "list" });
    $("addInput").value = "";
    if (tab === "pantry" && it) editSheet(it);
  });
  $("view").addEventListener("click", e => {
    const b = e.target.closest("button,input"); if (!b) return;
    const d = b.dataset;
    if (b.id === "starters"){ STARTERS.forEach(([n,c,u]) => S.items.push({ id:uid(), name:n, cat:c, unit:u, qty:1, min:null, since:Date.now(), used:[], bought:[], onList:false, inCart:false, cartQty:null })); tab="pantry"; commit(); toast("Added 12 staples. Tap one to set how many you have."); return; }
    if (d.go){ tab = d.go; render(); return; }
    if (d.cart){ const it = find(d.cart); it.inCart = b.checked; if (it.inCart && it.cartQty == null) it.cartQty = info(it).suggest; commit(); return; }
    if (d.cq){ const it = find(d.cq); const cur = it.cartQty ?? info(it).suggest; it.cartQty = Math.max(1, cur + Number(d.d)); commit(); return; }
    if (d.use){ use(find(d.use)); return; }
    if (d.addq){ const it = find(d.addq); it.qty = Math.round((it.qty+1)*100)/100; it.bought.push([Date.now(),1]); commit(); return; }
    if (d.edit){ editSheet(find(d.edit)); }
  });

  /* ---------- boot ---------- */
  const local = normalize(localLoad()); if (local) S = local;
  setSync("Saved on this device");
  render();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
